services:
  planter:
    build: .
    image: planter:latest
    container_name: planter
    ports:
      - "${PLANTER_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    environment:
      PORT: 8000
      # auto (défaut) : build si absent · force : rebuild à chaque start · never
      REFRESH_ON_START: ${REFRESH_ON_START:-auto}
      # Notifications d'échec du refresh (optionnel)
      TER_FINDER_TELEGRAM_TOKEN: ${TER_FINDER_TELEGRAM_TOKEN:-}
      TER_FINDER_TELEGRAM_CHAT_ID: ${TER_FINDER_TELEGRAM_CHAT_ID:-}
    restart: unless-stopped

name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ter-finder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # AAB release signé (Play Store). Ne construit le AAB que si les secrets de
  # signature sont configurés (repo Settings → Secrets) : KEYSTORE_BASE64,
  # KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD. Les secrets ne peuvent pas être
  # référencés dans un `if` de job (limitation GitHub Actions) : la vérification
  # se fait par une étape qui lit KEYSTORE_BASE64 via env et exporte skip=true.
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Check keystore availability
        id: keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Decode signing keystore
        if: steps.keystore.outputs.skip != 'true'
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ter-finder.keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Signed Release AAB
        if: steps.keystore.outputs.skip != 'true'
        run: cd android && KEYSTORE_PATH="$RUNNER_TEMP/ter-finder.keystore" ./gradlew bundleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB Artifact
        if: steps.keystore.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ter-finder-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  # Release APK signé sur tag vX.Y.Z : versionName = tag sans le « v »,
  # versionCode = nombre de commits. Publie une GitHub Release avec l'APK et
  # les checksums SHA256 (distribution site web / IzzyOnDroid / F-Droid).
  # Sans keystore configuré, le job échoue volontairement : un tag de release
  # doit produire un artefact signé.
  release-apk:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute version from tag
        id: version
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="$(git rev-list --count HEAD)"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version $VERSION_NAME ($VERSION_CODE)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secrets de signature absents (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Ajoutez-les puis relancez le workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ter-finder.keystore"

      - name: Build Signed Release APK
        run: >
          cd android &&
          KEYSTORE_PATH="$RUNNER_TEMP/ter-finder.keystore"
          ./gradlew assembleRelease --no-daemon
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename and checksum APK
        run: |
          OUT=android/app/build/outputs/apk/release
          cp "$OUT/app-release.apk" "PlanTER-v${{ steps.version.outputs.name }}.apk"
          # copie à nom de fichier stable : permet le lien permanent
          # releases/latest/download/PlanTER-android-latest.apk sur le site
          cp "$OUT/app-release.apk" "PlanTER-android-latest.apk"
          sha256sum "PlanTER-v${{ steps.version.outputs.name }}.apk" \
                    "PlanTER-android-latest.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify APK signature
        run: |
          BT="$ANDROID_HOME/build-tools"
          APKSIGNER=$(ls "$BT"/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "PlanTER-v${{ steps.version.outputs.name }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "PlanTER v${{ steps.version.outputs.name }}" \
            --generate-notes \
            "PlanTER-v${{ steps.version.outputs.name }}.apk" \
            "PlanTER-android-latest.apk" \
            SHA256SUMS.txt

# T12 — Modèle de tarification TER (ESTIMATION v2 — règles par région).
#
# Deux couches :
#   (1) RÈGLE RÉGIONALE (ci-dessous ; source data/pricing_rules.yaml) : grille
#       en escalier (prix forfaitaire par palier) ou affine P = a + b·d par
#       palier. Validée contre les prix réels vérifiés (14/08/2026) :
#         - Centre-Val de Loire, Bretagne, Bourgogne-Franche-Comté : 0,00 €
#           d'erreur moyenne (grilles en escalier) ;
#         - Provence-Alpes-Côte d'Azur, Hauts-de-France : ±0,30-0,60 € ;
#         - AURA / Nouvelle-Aquitaine : affines recalibrées (× 1,09 / × 1,02).
#       Paliers semi-ouverts [min, max) : un km de 15,9 appartient au palier
#       « 1 à 16 ». Le prix affine est arrondi au décime supérieur. Au-delà du
#       `max_km` validé d'une règle, repli sur la formule (2), borné entre le
#       dernier palier de la grille (monotonie) et le plafond `max_eur`.
#   (2) FORMULE CONTINUE : prix = scale_region × (a·√km + b·km), arrondi aux
#       `round_to` centimes, plancher `min_eur` (fallback par défaut).
#
#   km = distance ferroviaire ESTIMÉE = somme des haversine entre arrêts
#        consécutifs d'un leg × rail_factor (approximation de la longueur de
#        voie, toujours > distance à vol d'oiseau).
#
# Règle d'agrégation (§ Annexe C) :
#   - trajet MONO-RÉGION  : un seul billet sur la distance totale cumulée
#     (dégressivité globale) ;
#   - trajet PLURI-RÉGION : un billet par tronçon, sommé (pas d'accord
#     tarifaire inter-régions).
#
# Limites connues (14/08/2026) : tarifs d'axe dérogatoires non couverts par
# les règles (Lyon-Grenoble, Clermont-Lyon, Nice-Grasse, Caen-Cherbourg) et
# distances sous-estimées par le haversine×1,17 (référentiel PK à intégrer).

rail_factor: 1.17        # haversine -> longueur de voie approchée
min_eur: 3.00            # prix plancher d'un billet
round_to: 0.05           # arrondi aux 5 centimes
a: 1.934                 # terme √km (formule de repli)
b: 0.00652               # terme km (formule de repli)
default_scale: 1.0

regions:
  # --- Règles validées (grilles/barèmes) ------------------------------
  Bourgogne-Franche-Comté:
    scale: 0.9865        # repli hors grille (sans objet : grille complète)
    rule:
      type: escalier     # Mobigo, CGV 01/04/2026 : 6/13/19/24/31/36/41 € (7 paliers, 2 € enfant)
      max_km: 100000
